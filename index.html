<section id="start"><h1>Statistically Inevitable</h1><p>100 general-knowledge questions. Four options each. Pick your answers and see what happens.</p><p class="odds"><b>99.999999999968%</b>Chance of getting at least one correct answer by random guessing.</p><p>There is no feedback until you submit the entire quiz. Good luck!</p><button class="go" id="begin">Start Quiz</button></section>

const $=id=>document.getElementById(id);const show=id=>["start","quiz","end"].forEach(s=>$(s).hidden=s!==id);
const shuffle=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};let deck;
function start(){deck=shuffle(Q.slice()).map(([q,correct,...wrong])=>({q,correct,options:shuffle([correct,...wrong]),chosen:null}));render();show('quiz');}
function render(){const root=$('questions');root.replaceChildren();deck.forEach((item,idx)=>{const section=document.createElement('section');section.className='question';const h=document.createElement('h2');h.textContent=(idx+1)+'. '+item.q;section.appendChild(h);const opts=document.createElement('div');opts.className='opts';item.options.forEach((answer,oi)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=answer;b.setAttribute('aria-pressed','false');b.onclick=()=>{item.chosen=answer;opts.querySelectorAll('.opt').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});b.classList.add('selected');b.setAttribute('aria-pressed','true')};opts.appendChild(b)});section.appendChild(opts);root.appendChild(section)});$('progress').textContent='100 Questions · '+deck.length+' questions';}
function finish(){let hits=0;deck.forEach(item=>{if(item.chosen===item.correct)hits++;});const fails=deck.length-hits;$('final').textContent=hits+' / '+deck.length;let verdict;if(hits===0)verdict='Zero correct. Against all odds, you managed it.';else if(hits===deck.length)verdict='A perfect score! Random guessing would be an extraordinary explanation.';else verdict=`You got ${hits} correct and ${fails} wrong. Random guessing averages about 25 correct out of 100.`;$('verdict').textContent=verdict;$('odds').textContent='Probability of getting all 100 wrong by random guessing: (3/4)^100 ≈ 1 in 3.12 trillion. After submitting, correct answers are highlighted green and incorrect selections red.';
const sections=document.querySelectorAll('.question');deck.forEach((item,idx)=>{const opts=sections[idx].querySelectorAll('.opt');opts.forEach(b=>{b.disabled=true;if(b.textContent===item.correct)b.classList.add('right');else if(b.textContent===item.chosen)b.classList.add('wrong')})});show('end');}
$('begin').onclick=start;$('submit').onclick=finish;$('again').onclick=start;
